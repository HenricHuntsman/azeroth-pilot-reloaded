name: Localization helper tests

on:
  pull_request:
    paths:
      - '.github/scripts/curseforge_localization_fetch.py'
      - 'tests/scripts/test_curseforge_localization_fetch.py'
      - '.github/workflows/localization-helper-tests.yml'
  push:
    branches: [dev]
    paths:
      - '.github/scripts/curseforge_localization_fetch.py'
      - 'tests/scripts/test_curseforge_localization_fetch.py'
      - '.github/workflows/localization-helper-tests.yml'

permissions:
  contents: read

jobs:
  authorization-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test dependency
        run: python -m pip install 'requests>=2.31,<3'
      - name: Run offline authorization tests
        run: python -m unittest discover -s tests/scripts -p 'test_curseforge_localization_fetch.py' -v
